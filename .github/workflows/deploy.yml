name: CI/CD Deploy

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /srv/senifit-front
      RELEASE_NAME: ${{ github.sha }}
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      API_PREFIX: ${{ secrets.API_PREFIX }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # next는 dependencies에 있어야 함. devDeps는 제거해 산출물 슬림화
      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Create deploy package
        run: |
          mkdir -p deploy
          # 실행에 필요한 산출물만 포함 (.next, node_modules, 정적파일, 설정)
          cp -r .next node_modules package.json package-lock.json public next.config.* deploy/ 2>/dev/null || true
          tar -C deploy -czf release.tgz .

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Remote prep (cleanup & prepare)
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SERVICE_USER: ubuntu 
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -se <<'PREP'
          set -euo pipefail
          APP_DIR="/srv/senifit-front"

          mkdir -p "$APP_DIR/releases"
          cd "$APP_DIR/releases"

          # 최신 3개만 보존
          ls -1t | tail -n +4 | xargs -r rm -rf

          # current가 아닌 릴리즈의 캐시/모듈 정리 (추가 공간 확보)
          CURR="$(readlink -f "$APP_DIR/current" || true)"
          for d in "$APP_DIR"/releases/*; do
            [ -d "$d" ] || continue
            if [ "$(readlink -f "$d")" != "$CURR" ]; then
              rm -rf "$d/.next/cache" "$d/node_modules" || true
            fi
          done
          PREP

      - name: Remote deploy (stream, extract, swap, restart)
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          SERVICE_USER: ubuntu 
        run: |
          # 중요: RELEASE_NAME을 원격 bash에 "환경변수"로 주입해서 set -u 에러 방지
          cat release.tgz | ssh "$EC2_USER@$EC2_HOST" "RELEASE_NAME=$RELEASE_NAME SERVICE_USER=$SERVICE_USER bash -se" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/srv/senifit-front"
          REL="${RELEASE_NAME}"

          mkdir -p "$APP_DIR/releases/$REL"
          # stdin으로 받은 tar를 바로 해제 (중간 파일 無)
          tar -xzf - -C "$APP_DIR/releases/$REL"

          # 소유권 정리
          chown -R "$SERVICE_USER:$SERVICE_USER" "$APP_DIR/releases/$REL"

          # 원자적 스와프
          ln -sfn "$APP_DIR/releases/$REL" "$APP_DIR/current"

          # 재시작 & 로컬 헬스체크
          sudo systemctl daemon-reload
          sudo systemctl restart senifit-front
          curl -sS -I http://127.0.0.1:3000 | head -n1
          REMOTE


      - name: Public healthcheck
        run: |
          curl -sSL -o /dev/null -w 'HTTPS %s -> %{http_code}\n' https://senifit.co.kr
